apiVersion: v1
kind: Service
metadata:
  name: inventory-service-node
  labels:
    app: inventory-service-node
spec:
  # ClusterIP: este servicio confía en las cabeceras X-Organization-Id /
  # X-Permissions que pone el gateway. Con NodePort cualquiera en la red del
  # nodo podía llamarlo directo y hacerse pasar por cualquier organización.
  type: ClusterIP
  selector:
    app: inventory-service-node
  ports:
    - protocol: TCP
      port: 3013
      targetPort: 3013