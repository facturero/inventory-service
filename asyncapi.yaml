asyncapi: 3.0.0

info:
  title: inventory-service — Eventos
  version: 1.0.0
  description: >
    Eventos de inventory-service sobre RabbitMQ. Publica el ciclo del stock
    (entradas, salidas, ajustes, transferencias, reservas). Consume eventos de
    organization (bodegas por establecimiento), product (read-model), billing
    (facturación) y purchase-service (compras, futuro).


    Los payloads llevan siempre `productId + warehouseId + quantity` para que
    los consumidores puedan reconstruir el estado del kardex.


    Patrón Outbox + processed_events. Exchange topic `crm.events`.


    NINGÚN evento de este servicio queda sin consumir. audit-log-service bindea `#` con
    denylist vacía, así que todo lo que se publique aquí acaba como fila en audit_db. Eso
    NO es motivo para publicar de más: cada evento emitido es una fila de bitácora que
    alguien paga en disco y en ruido. Antes de añadir un evento nuevo, ver la sección de
    volumen en IMPLEMENTATION.md.


    Requisito de la bitácora: todo mensaje debe llevar `eventId` en headers y
    `organizationId` en el payload. Sin lo primero audit lo descarta con warn; sin lo
    segundo lo considera no auditable. El relay del outbox ya pone el header.

defaultContentType: application/json

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    bindings:
      amqp:
        vhost: /

channels:

  warehouseCreated:
    address: inventory.warehouse.created
    description: Se creó una bodega.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      warehouseCreated: { $ref: '#/components/messages/WarehouseCreated' }

  stockEntered:
    address: inventory.stock.entered
    description: >
      Entrada de stock: compra, ajuste positivo, saldo inicial, reposición por anulación.
      NO se emite por transferencia: el traslado publica un único inventory.stock.transferred.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockEntered: { $ref: '#/components/messages/StockMovementEvent' }

  stockConsumed:
    address: inventory.stock.consumed
    description: >
      Salida de stock: venta, ajuste negativo. NO se emite por transferencia: el traslado
      publica un único inventory.stock.transferred, aunque escriba dos filas de kardex.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockConsumed: { $ref: '#/components/messages/StockMovementEvent' }

  stockAdjusted:
    address: inventory.stock.adjusted
    description: Ajuste manual con motivo (conteo físico, merma, avería, corrección).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockAdjusted: { $ref: '#/components/messages/StockMovementEvent' }

  stockTransferred:
    address: inventory.stock.transferred
    description: >
      Transferencia entre bodegas. UN solo evento para las dos filas de kardex: el payload
      lleva origen, destino y los dos movementId. Es una acción del usuario, no dos.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockTransferred: { $ref: '#/components/messages/StockTransferredEvent' }

  # stockReserved y reservationReleased: FASE 2. Nadie los publica en esta fase.
  stockReserved:
    address: inventory.stock.reserved
    description: Reserva de stock (ej. borrador de factura).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockReserved: { $ref: '#/components/messages/ReservationEvent' }

  reservationReleased:
    address: inventory.reservation.released
    description: Reserva liberada (borrador descartado, o release explícito).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      reservationReleased: { $ref: '#/components/messages/ReservationEvent' }

  stockNegative:
    address: inventory.stock.negative
    description: >
      Alerta: una salida dejó la posición debajo de cero. Se emite SIEMPRE que ocurra,
      tenga el producto `allow_negative_stock` en true o en false. El inventario nunca
      se niega a registrar una salida ya facturada: la mercadería salió del local y el
      kardex debe decirlo. El flag solo indica si esto era esperado o es una incidencia
      que alguien debe revisar. Los consumidores (notification, dashboards) alertan.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockNegative: { $ref: '#/components/messages/StockNegativeEvent' }

  stockStale:
    address: inventory.stock.stale
    description: >
      El modulo estuvo desactivado y volvio. Durante ese hueco se siguio vendiendo y el
      kardex no lo vio, asi que el stock NO es confiable y hace falta un conteo fisico.
      Lleva las fechas del hueco y cuantos movimientos se dejaron de escribir.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      stockStale: { $ref: '#/components/messages/StockStaleEvent' }

  # ---- Consumidos ----

  pluginActivated:
    address: plugin.activated
    description: >
      (Consumido) Solo interesa code = 'inventory.kardex'. Marca active en el read-model,
      cierra el hueco abierto y emite inventory.stock.stale. Este servicio es de pago: sin
      el plugin activo NO se lleva inventario.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      pluginActivated: { $ref: '#/components/messages/PluginEvent' }

  pluginDeactivated:
    address: plugin.deactivated
    description: >
      (Consumido) Marca disabled y abre un hueco. A partir de aqui las facturas emitidas NO
      mueven el stock. El kardex historico se conserva, solo deja de crecer.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      pluginDeactivated: { $ref: '#/components/messages/PluginEvent' }

  orgUpdated:
    address: organization.org.updated
    description: (Consumido) organization completó perfil fiscal. Auto-provisiona bodega PRINCIPAL.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      orgUpdated: { $ref: '#/components/messages/OrgUpdatedEvent' }

  establishmentCreated:
    address: organization.establishment.created
    description: >
      (Consumido) se creó un establecimiento. Auto-provisiona su bodega, idempotente.
      NO es opcional: de esta bodega descuenta toda venta emitida por ese establecimiento.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      establishmentCreated: { $ref: '#/components/messages/EstablishmentCreatedEvent' }

  productCreated:
    address: product.product.created
    description: (Consumido) product creado. Alimenta el read-model local con trackStock, allowNegativeStock, valuationMethod, status.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      productCreated: { $ref: '#/components/messages/ProductCreatedEvent' }

  productUpdated:
    address: product.product.updated
    description: >
      (Consumido) product actualizado. Refresca el read-model local. Los cambios de
      `valuationMethod` NO afectan movimientos ya registrados (estos conservan su costo
      histórico); solo aplican a movimientos futuros.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      productUpdated: { $ref: '#/components/messages/ProductUpdatedEvent' }

  productDisabled:
    address: product.product.disabled
    description: (Consumido) product desactivado. Marca status='inactive' en el read-model.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      productDisabled: { $ref: '#/components/messages/ProductDisabledEvent' }

  invoiceIssued:
    address: billing.invoice.issued
    description: >
      (Consumido) billing emitió factura. Resuelve la bodega una vez por factura a partir
      de establishmentId, con respaldo en la bodega PRINCIPAL. Por cada línea con producto
      tracked genera sale_out directo con accounting_nature = cogs. Sin reservas: el
      descuento ocurre al emitir, no en borrador. El movimiento se escribe siempre, aunque
      la posición quede negativa: la factura ya está firmada. allow_negative_stock NO se
      evalúa aquí, el bloqueo pertenece a billing y al punto de venta antes de emitir.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      invoiceIssued: { $ref: '#/components/messages/InvoiceIssuedEvent' }

  invoiceVoided:
    address: billing.invoice.voided
    description: >
      (Consumido) billing anuló factura. Repone leyendo los sale_out por reference y
      devolviendo cada uno a su costo original, nunca al promedio vigente. Genera
      adjustment_in con accounting_nature = inventory_in. Con FIFO crea un layer nuevo.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      invoiceVoided: { $ref: '#/components/messages/InvoiceVoidedEvent' }

  purchaseReceived:
    address: purchase.purchase_order.received
    description: >
      (Consumido, FUTURO) purchase-service registra la recepción de mercadería.
      Genera purchase_in con unitCost del proveedor. Aplica ValuationStrategy.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      purchaseReceived: { $ref: '#/components/messages/PurchaseReceivedEvent' }

operations:

  publishWarehouseCreated:
    action: send
    channel: { $ref: '#/channels/warehouseCreated' }

  publishStockEntered:
    action: send
    channel: { $ref: '#/channels/stockEntered' }
    summary: Entrada (purchase_in, adjustment_in, transfer_in, compensación por voided).

  publishStockConsumed:
    action: send
    channel: { $ref: '#/channels/stockConsumed' }
    summary: Salida confirmada (sale_out, transfer_out).

  publishStockAdjusted:
    action: send
    channel: { $ref: '#/channels/stockAdjusted' }

  publishStockTransferred:
    action: send
    channel: { $ref: '#/channels/stockTransferred' }

  publishStockReserved:
    action: send
    channel: { $ref: '#/channels/stockReserved' }

  publishReservationReleased:
    action: send
    channel: { $ref: '#/channels/reservationReleased' }

  publishStockNegative:
    action: send
    channel: { $ref: '#/channels/stockNegative' }

  publishStockStale:
    action: send
    channel: { $ref: '#/channels/stockStale' }
    summary: Avisa de que el stock quedo desactualizado mientras el modulo estuvo apagado.

  consumePluginActivated:
    action: receive
    channel: { $ref: '#/channels/pluginActivated' }
    summary: Reactiva el seguimiento de stock y cierra el hueco.

  consumePluginDeactivated:
    action: receive
    channel: { $ref: '#/channels/pluginDeactivated' }
    summary: Corta el seguimiento de stock y abre un hueco.

  consumeOrgUpdated:
    action: receive
    channel: { $ref: '#/channels/orgUpdated' }
    summary: Auto-provisiona bodega PRINCIPAL (idempotente).

  consumeEstablishmentCreated:
    action: receive
    channel: { $ref: '#/channels/establishmentCreated' }
    summary: Crea la bodega del establecimiento (idempotente). Obligatorio, no opcional.

  consumeProductCreated:
    action: receive
    channel: { $ref: '#/channels/productCreated' }
    summary: Alta en el read-model local de producto.

  consumeProductUpdated:
    action: receive
    channel: { $ref: '#/channels/productUpdated' }
    summary: Actualiza read-model local de producto.

  consumeProductDisabled:
    action: receive
    channel: { $ref: '#/channels/productDisabled' }
    summary: Marca producto como inactivo en el read-model local.

  consumeInvoiceIssued:
    action: receive
    channel: { $ref: '#/channels/invoiceIssued' }
    summary: Genera sale_out directo por línea tracked, en la bodega del establecimiento emisor.

  consumeInvoiceVoided:
    action: receive
    channel: { $ref: '#/channels/invoiceVoided' }
    summary: Repone stock con adjustment_in al costo original, leído del kardex.

  consumePurchaseReceived:
    action: receive
    channel: { $ref: '#/channels/purchaseReceived' }
    summary: >
      Registra purchase_in aplicando ValuationStrategy. Escrito por adelantado: no existe
      servicio de compras, así que hoy nadie publica este evento.

components:

  messageTraits:
    eventEnvelope:
      headers:
        type: object
        required: [eventId, type, occurredAt]
        properties:
          eventId: { type: string, format: uuid }
          type: { type: string }
          occurredAt: { type: string, format: date-time }
          organizationId: { type: string, format: uuid, nullable: true }

  messages:
    WarehouseCreated:
      name: inventory.warehouse.created
      title: Bodega creada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/WarehousePayload' }

    StockMovementEvent:
      name: inventory.stock.movement
      title: Movimiento de stock (entrada/salida/ajuste)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/StockMovementPayload' }

    StockTransferredEvent:
      name: inventory.stock.transferred
      title: Transferencia entre bodegas
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/StockTransferPayload' }

    ReservationEvent:
      name: inventory.reservation
      title: Reserva creada / liberada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ReservationPayload' }

    StockNegativeEvent:
      name: inventory.stock.negative
      title: Alerta de stock negativo
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/StockNegativePayload' }

    StockStaleEvent:
      name: inventory.stock.stale
      title: Stock no confiable tras reactivar el modulo
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/StockStalePayload' }

    PluginEvent:
      name: plugin.activated / plugin.deactivated
      title: Plugin activado o desactivado (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/PluginPayload' }

    OrgUpdatedEvent:
      name: organization.org.updated
      title: Organización actualizada (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/OrgUpdatedPayload' }

    EstablishmentCreatedEvent:
      name: organization.establishment.created
      title: Establecimiento creado (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/EstablishmentCreatedPayload' }

    ProductCreatedEvent:
      name: product.product.created
      title: Producto creado (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ProductEventPayload' }

    ProductUpdatedEvent:
      name: product.product.updated
      title: Producto actualizado (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ProductEventPayload' }

    ProductDisabledEvent:
      name: product.product.disabled
      title: Producto desactivado (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload:
        type: object
        required: [productId, organizationId]
        properties:
          productId: { type: string, format: uuid }
          organizationId: { type: string, format: uuid }

    InvoiceIssuedEvent:
      name: billing.invoice.issued
      title: Factura emitida (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/InvoiceIssuedPayload' }

    InvoiceVoidedEvent:
      name: billing.invoice.voided
      title: Factura anulada (consumido)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/InvoiceVoidedPayload' }

    PurchaseReceivedEvent:
      name: purchase.purchase_order.received
      title: Recepción de compra (consumido, futuro)
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/PurchaseReceivedPayload' }

  schemas:

    WarehousePayload:
      type: object
      required: [warehouseId, organizationId, code, name, isDefault]
      properties:
        warehouseId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        isDefault: { type: boolean }

    StockMovementPayload:
      type: object
      required: [movementId, organizationId, productId, warehouseId, type, quantity, accountingNature]
      properties:
        movementId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        type:
          type: string
          enum: [purchase_in, sale_out, transfer_out, transfer_in, adjustment_in, adjustment_out, opening_balance]
        quantity: { type: string, description: DECIMAL string. Siempre positivo; el `type` indica signo lógico. }
        unitCostCents: { type: integer, format: int64, nullable: true }
        totalCostCents: { type: integer, format: int64, nullable: true }
        currencyCode: { type: string, example: USD }
        referenceType: { type: string, nullable: true, description: 'invoice, purchase_order, adjustment, transfer' }
        referenceId: { type: string, format: uuid, nullable: true }
        accountingNature:
          type: string
          enum: [inventory_in, inventory_gain, cogs, expense, shrinkage, internal_transfer]
          description: >
            Qué significa el movimiento para la contabilidad. El futuro generador de asientos
            lo combina con la cuenta del producto. Se emite siempre.
        reasonCode:
          type: string
          nullable: true
          enum: [physical_count, damage, expiration, theft, internal_use, correction, opening_balance]
          description: Solo en ajustes. Es de donde sale accountingNature.
        lotId: { type: string, format: uuid, nullable: true, description: Reservado. Siempre null en esta fase. }
        newOnHand: { type: string, description: Posición on_hand tras el movimiento. }
        newAverageCostCents: { type: integer, format: int64, description: Nuevo promedio (para valorización weighted_average). }

    StockTransferPayload:
      type: object
      required: [organizationId, productId, fromWarehouseId, toWarehouseId, quantity]
      properties:
        organizationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        fromWarehouseId: { type: string, format: uuid }
        toWarehouseId: { type: string, format: uuid }
        quantity: { type: string }
        outMovementId: { type: string, format: uuid }
        inMovementId: { type: string, format: uuid }
        unitCostCents: { type: integer, format: int64, description: Costo transferido (mantiene la valorización). }
        currencyCode: { type: string }

    ReservationPayload:
      type: object
      required: [reservationId, organizationId, productId, warehouseId, quantity, referenceType, referenceId, status]
      properties:
        reservationId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: string }
        referenceType: { type: string }
        referenceId: { type: string, format: uuid }
        status: { type: string, enum: [active, confirmed, released, expired] }

    StockNegativePayload:
      type: object
      description: Se dispara SOLO si el producto tiene allow_negative_stock=true y la salida dejó la posición debajo de 0.
      required: [organizationId, productId, warehouseId, currentOnHand]
      properties:
        organizationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currentOnHand: { type: string, example: "-3.5000" }

    # --- Payloads de eventos consumidos ---

    StockStalePayload:
      type: object
      required: [organizationId, startedAt, endedAt, skippedMovements]
      properties:
        organizationId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time, description: Cuando se desactivo el modulo. }
        endedAt: { type: string, format: date-time, description: Cuando se reactivo. }
        skippedMovements:
          type: integer
          description: >
            Cuantos movimientos de kardex se dejaron de escribir durante el hueco. No se
            reprocesan: la respuesta correcta es un conteo fisico con SetOpeningBalance.

    PluginPayload:
      type: object
      required: [organizationId, code]
      properties:
        organizationId: { type: string, format: uuid }
        pluginId: { type: string, format: uuid }
        code: { type: string, example: inventory.kardex, description: Solo interesa inventory.kardex. }
        activationSource: { type: string, nullable: true }

    OrgUpdatedPayload:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
        countryCode: { type: string, nullable: true }
        name: { type: string }

    EstablishmentCreatedPayload:
      type: object
      required: [establishmentId, organizationId, code]
      properties:
        establishmentId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    ProductEventPayload:
      type: object
      required: [productId, organizationId, name, type, trackStock, allowNegativeStock, valuationMethod, status]
      properties:
        productId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        sku: { type: string, nullable: true }
        name: { type: string }
        type: { type: string, enum: [good, service] }
        trackStock: { type: boolean, description: Si false, inventory no lleva stock de este producto. }
        allowNegativeStock: { type: boolean, description: Si true, billing puede vender sin stock; solo alerta. }
        valuationMethod: { type: string, enum: [weighted_average, fifo] }
        status: { type: string, enum: [active, inactive] }

    InvoiceIssuedPayload:
      type: object
      required: [invoiceId, organizationId, establishmentId, lines]
      properties:
        invoiceId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        countryCode: { type: string }
        establishmentId:
          type: string
          format: uuid
          description: >
            De aqui sale la bodega. billing NO conoce bodegas y nunca ha enviado
            warehouseId: quien resuelve es inventory, buscando la bodega de este
            establecimiento y cayendo en la PRINCIPAL si no la encuentra.
        emissionPointId: { type: string, format: uuid }
        currencyCode: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid, description: Siempre presente; billing no admite lineas sin producto. }
              description: { type: string }
              quantity:
                type: number
                description: >
                  OJO: billing lo modela como `number` de JavaScript, no como DECIMAL
                  string. inventory debe convertirlo con Decimal.js ANTES de operar, nunca
                  sumar o restar el numero crudo. Es la unica entrada de todo el servicio
                  que llega como float, y por eso la unica donde se puede perder precision.
              unitPriceCents: { type: integer }
              discountCents: { type: integer }
              subtotalCents: { type: integer }

    InvoiceVoidedPayload:
      type: object
      required: [invoiceId, organizationId]
      properties:
        invoiceId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        reason: { type: string, nullable: true }

    PurchaseReceivedPayload:
      type: object
      required: [purchaseOrderId, organizationId, warehouseId, lines]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [productId, quantity, unitCostCents, currencyCode]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: string }
              unitCostCents: { type: integer, format: int64 }
              currencyCode: { type: string }
